<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>16. 재가입 가능 여부 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">재가입 안내</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="result-block">
						<div class="result-icon result-icon--success">
							<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
								<polyline points="6,17 13,24 26,9" />
							</svg>
						</div>
						<h2 class="result-block__title">재가입이
가능해요</h2>
						<span class="result-block__sub">이전 계정의 일부 정보를 복원해서 시작할 수 있어요.</span>
					</div>

					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">재가입 가능 여부</span>
							<span class="detail-grid__value detail-grid__value--violet">가능</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">탈퇴일</span>
							<span class="detail-grid__value">2025.10.20</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">제한 종료일</span>
							<span class="detail-grid__value">해당 없음</span>
						</div>
					</div>

					<div class="status-card">
						<div class="status-card__title">복원 가능 항목</div>
						<div class="status-card__row">
							<span class="status-card__label">기본 프로필</span>
							<span class="status-card__value status-card__value--success">복원 가능</span>
						</div>
						<div class="status-card__row">
							<span class="status-card__label">관심 카테고리</span>
							<span class="status-card__value status-card__value--success">복원 가능</span>
						</div>
						<div class="status-card__row">
							<span class="status-card__label">쿠폰·포인트</span>
							<span class="status-card__value">복원 불가</span>
						</div>
						<div class="status-card__row">
							<span class="status-card__label">결제 이력</span>
							<span class="status-card__value">법정 보관분만 조회</span>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">개인정보 처리방침에 따라 일부 정보는 복원할 수 없어요.</li>
							<li class="info-box__item">복원 없이 신규 계정으로 시작할 수도 있어요.</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">복원하고 재가입</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
