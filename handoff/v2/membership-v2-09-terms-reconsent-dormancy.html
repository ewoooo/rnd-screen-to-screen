<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v2 · 09. 약관 재동의 (휴면) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">약관 재동의</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">휴면 해제를 위해
약관에 다시 동의해 주세요</h1><span class="pay-hero__sub">휴면 기간 중 변경된 약관에 다시 동의해야 해제가 진행돼요.</span></div>
					<div class="terms-row terms-row--emph"><span class="check-indicator check-indicator--on">✓</span><span class="terms-row__label">전체 동의 (선택 항목 포함)</span></div>
					<div class="group">
						<span class="text-section-label">필수 약관 (변경)</span>
						<div class="terms-row"><span class="check-indicator check-indicator--on">✓</span><span class="terms-row__label">서비스 이용약관 v2.4<span class="terms-row__required">필수</span></span><span class="terms-row__chev">›</span></div>
						<div class="terms-row"><span class="check-indicator check-indicator--on">✓</span><span class="terms-row__label">개인정보 처리방침 v3.1<span class="terms-row__required">필수</span></span><span class="terms-row__chev">›</span></div>
					</div>
					<div class="group">
						<span class="text-section-label">선택 약관</span>
						<div class="terms-row"><span class="check-indicator check-indicator--off"></span><span class="terms-row__label">마케팅 정보 수신 동의</span><span class="terms-row__chev">›</span></div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">휴면 기간 중 변경된 항목만 재동의 대상이에요.</li><li class="info-box__item">동의 이력은 갱신되어 저장돼요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">동의하고 해제하기</button></div></div>
		</div>
	</div>
