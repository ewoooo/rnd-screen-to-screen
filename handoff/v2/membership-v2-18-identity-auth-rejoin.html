<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v2 · 18. 본인인증 (재가입) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">본인인증</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">본인인증을
진행해 주세요</h1><span class="pay-hero__sub">재가입 가능 여부를 확인하기 위해 본인을 인증해요.</span></div>
					<div class="method-toggle"><div class="method-toggle__seg method-toggle__seg--active">휴대폰 인증</div><div class="method-toggle__seg">이메일 인증</div></div>
					<div class="form-stack">
						<div class="field-group"><label class="field-label">휴대폰 번호</label><div class="field-input"><span class="field-input__value">010-1234-5678</span><span class="action-chip action-chip--fill">인증번호 받기</span></div></div>
						<div class="field-group"><label class="field-label">인증번호</label><div class="field-input field-input--focused"><span class="field-input__value" style="letter-spacing: 6px;">428••</span><span class="action-chip action-chip--tabular">02:48</span></div></div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">CI/DI를 통해 이전 가입 이력이 자동 조회돼요.</li><li class="info-box__item">3회 실패 시 일정 시간 동안 인증이 제한될 수 있어요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">인증하고 계속하기</button></div></div>
		</div>
	</div>
</body>
</html>
