<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>01. 약관 동의 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">약관 동의</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="pay-hero">
						<h1 class="pay-hero__title">T우주 시작을 위해
약관에 동의해 주세요</h1>
						<span class="pay-hero__sub">필수 약관에 동의해야 가입을 진행할 수 있어요.</span>
					</div>

					<div class="terms-row terms-row--emph">
						<span class="check-indicator check-indicator--on">✓</span>
						<span class="terms-row__label">전체 동의 (선택 항목 포함)</span>
					</div>

					<div class="group">
						<span class="text-section-label">필수 약관</span>
						<div class="terms-row">
							<span class="check-indicator check-indicator--on">✓</span>
							<span class="terms-row__label">서비스 이용약관<span class="terms-row__required">필수</span></span>
							<span class="terms-row__chev">›</span>
						</div>
						<div class="terms-row">
							<span class="check-indicator check-indicator--on">✓</span>
							<span class="terms-row__label">개인정보 수집·이용 동의<span class="terms-row__required">필수</span></span>
							<span class="terms-row__chev">›</span>
						</div>
					</div>

					<div class="group">
						<span class="text-section-label">선택 약관</span>
						<div class="terms-row">
							<span class="check-indicator check-indicator--on">✓</span>
							<span class="terms-row__label">마케팅 정보 수신 동의</span>
							<span class="terms-row__chev">›</span>
						</div>
						<div class="terms-row">
							<span class="check-indicator check-indicator--off"></span>
							<span class="terms-row__label">맞춤형 혜택 제공 동의</span>
							<span class="terms-row__chev">›</span>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">만 14세 미만 고객은 법정대리인 동의가 필요해요.</li>
							<li class="info-box__item">동의한 약관 버전은 동의이력에 안전하게 저장돼요.</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">동의하고 계속하기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
