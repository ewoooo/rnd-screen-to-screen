<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>11. 탈퇴 전 안내 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">탈퇴 전 안내</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar">
						<span class="step-bar__dot step-bar__dot--active"></span>
						<span class="step-bar__dot step-bar__dot--active"></span>
						<span class="step-bar__dot"></span>
					</div>
					<div class="pay-hero">
						<h1 class="pay-hero__title">탈퇴 전
꼭 확인해 주세요</h1>
					</div>

					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">보유 T+ 포인트</span>
							<span class="detail-grid__value">12,400P</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">보유 쿠폰</span>
							<span class="detail-grid__value">2장</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">다음 정기결제일</span>
							<span class="detail-grid__value">2026.05.10</span>
						</div>
					</div>

					<div class="info-box">
						<span class="info-box__title">탈퇴 시 처리 사항</span>
						<ul class="info-box__list">
							<li class="info-box__item">보유 포인트(12,400P)는 탈퇴 즉시 소멸돼요.</li>
							<li class="info-box__item">발급된 쿠폰 2장은 모두 회수돼요.</li>
							<li class="info-box__item">미납 금액이 있으면 탈퇴를 진행할 수 없어요.</li>
							<li class="info-box__item">탈퇴 후 7일 이내 철회할 수 있어요.</li>
						</ul>
					</div>

					<div class="info-box">
						<span class="info-box__title">연결 서비스 영향</span>
						<ul class="info-box__list">
							<li class="info-box__item">T우주 멤버십 자동결제가 즉시 해지돼요.</li>
							<li class="info-box__item">OTT 등 제휴 서비스 혜택이 만료돼요.</li>
						</ul>
					</div>

					<div class="terms-row terms-row--emph">
						<span class="check-indicator check-indicator--on">✓</span>
						<span class="terms-row__label">위 내용을 모두 확인했어요</span>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">다음</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
