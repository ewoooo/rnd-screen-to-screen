<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>10. 정기 결제 실패 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<style>
		.dim-card-inner {
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: var(--card-radius);
			padding: var(--spacing-32);
			display: flex;
			flex-direction: column;
			gap: var(--spacing-8);
		}
		.dim-card-name {
			font-size: 18px;
			font-weight: 700;
			color: var(--semantic-label-normal);
		}
		.dim-card-sub {
			font-size: 13px;
			font-weight: 700;
			color: var(--semantic-label-alternative);
		}
		.sheet-title {
			margin: 0;
			text-align: center;
			font-size: 20px;
			font-weight: 700;
			letter-spacing: -1px;
			line-height: 1.3;
			color: var(--semantic-label-normal);
		}
		.sheet-body {
			margin: 0;
			font-size: 13px;
			color: var(--semantic-label-alternative);
			line-height: 20.8px;
			text-align: center;
			white-space: pre-line;
		}
		.bottom-sheet {
			align-items: center;
		}
		.bottom-sheet > * { width: 100%; }
		.bottom-sheet > .result-icon { width: 64px; }
		.bottom-sheet > .sheet-title { width: 100%; }
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">구독 관리</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="dim-card">
						<div class="dim-card-inner">
							<span class="dim-card-name">T우주 멤버십</span>
							<span class="dim-card-sub">13,900원/월</span>
						</div>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="bottom-sheet">
					<div class="result-icon result-icon--warning">
						<span style="font-size: 30px;">⚠️</span>
					</div>
					<h2 class="sheet-title">정기 결제가 실패했어요</h2>
					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">결제 수단</span>
							<span class="detail-grid__value">신한카드 ••3721</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">시도 횟수</span>
							<span class="detail-grid__value detail-grid__value--violet">2/6회</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">실패 사유</span>
							<span class="detail-grid__value">잔액 부족</span>
						</div>
					</div>
					<p class="sheet-body">D+2까지 최대 6회 자동 재시도해요.
지금 바로 결제하거나 결제 수단을 변경할 수 있어요.</p>
					<div class="dual-cta" style="position: static; padding: var(--spacing-12) 0 0; border: none; box-shadow: none; background: transparent;">
						<button class="dual-cta__btn dual-cta__btn--ghost" type="button">결제 수단 변경</button>
						<button class="dual-cta__btn dual-cta__btn--primary" type="button">즉시 결제</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
