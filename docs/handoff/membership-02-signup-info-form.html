<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>02. 회원 정보 입력 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>
		.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">회원 정보 입력</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar">
						<span class="step-bar__dot step-bar__dot--active"></span>
						<span class="step-bar__dot"></span>
						<span class="step-bar__dot"></span>
					</div>
					<div class="pay-hero">
						<h1 class="pay-hero__title">기본 정보를
입력해 주세요</h1>
						<span class="pay-hero__sub">다음 단계인 본인인증 후 가입이 완료돼요.</span>
					</div>

					<div class="form-stack">
						<div class="field-group">
							<label class="field-label">이름</label>
							<div class="field-input">
								<span class="field-input__value">이정훈</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">아이디</label>
							<div class="field-input">
								<span class="field-input__value">junghoon99</span>
								<span class="action-chip action-chip--fill">중복확인</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">비밀번호</label>
							<div class="field-input">
								<span class="field-input__value" style="letter-spacing: 4px;">•••••••••••</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">비밀번호 확인</label>
							<div class="field-input">
								<span class="field-input__value" style="letter-spacing: 4px;">•••••••••••</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">이메일</label>
							<div class="field-input">
								<span class="field-input__value">junghoon99@example.com</span>
								<span class="action-chip action-chip--fill">중복확인</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">휴대폰 번호</label>
							<div class="field-input field-input--focused">
								<span class="field-input__value">010-1234-5678</span>
							</div>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">비밀번호는 영문·숫자·특수문자를 모두 포함해야 해요.</li>
							<li class="info-box__item">이미 가입된 아이디·이메일·휴대폰 번호는 사용할 수 없어요.</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">본인인증 받기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
