<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>02. 카드 정보 입력 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<style>
		.card-preview {
			position: relative;
			height: 180px;
			padding: var(--spacing-24);
			border-radius: 16px;
			background: linear-gradient(135deg, #1f2240 0%, #2a2266 60%, #3617ce 100%);
			color: #fff;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			box-shadow: 0 12px 40px rgba(27, 11, 102, 0.18);
		}
		.card-preview__issuer {
			font-size: 12px;
			color: rgba(255, 255, 255, 0.6);
			font-weight: 500;
		}
		.card-preview__number {
			font-size: 18px;
			color: #fff;
			font-weight: 700;
			letter-spacing: 3px;
			margin-top: var(--spacing-12);
		}
		.card-preview__bottom {
			margin-top: auto;
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
		}
		.card-preview__valid-label {
			font-size: 10px;
			color: rgba(255, 255, 255, 0.5);
		}
		.card-preview__valid {
			font-size: 14px;
			font-weight: 700;
			color: #fff;
		}
		.card-preview__brand {
			font-size: 11px;
			font-weight: 700;
			color: rgba(255, 255, 255, 0.5);
		}
		.card-preview__sheen {
			position: absolute;
			right: -20px;
			top: -20px;
			width: 160px;
			height: 160px;
			border-radius: 80px;
			background: rgba(255, 255, 255, 0.04);
		}
		.form-stack { display: flex; flex-direction: column; gap: var(--spacing-16); }
		.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-12); }
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">카드 정보 입력</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar">
						<div class="step-bar__dot step-bar__dot--active"></div>
						<div class="step-bar__dot step-bar__dot--active"></div>
						<div class="step-bar__dot"></div>
					</div>

					<!-- Card preview -->
					<div class="card-preview">
						<span class="card-preview__issuer">신한카드</span>
						<span class="card-preview__number">5413  ••••  ••••  3721</span>
						<div class="card-preview__bottom">
							<div style="display: flex; flex-direction: column; gap: 2px;">
								<span class="card-preview__valid-label">VALID THRU</span>
								<span class="card-preview__valid">12 / 26</span>
							</div>
							<span class="card-preview__brand">CREDIT</span>
						</div>
						<div class="card-preview__sheen"></div>
					</div>

					<!-- Form -->
					<div class="form-stack">
						<div class="field-group">
							<label class="field-label">카드번호</label>
							<div class="field-input field-input--focused">
								<span class="field-input__value" style="letter-spacing: 2px;">5413  ••••  ••••  3721</span>
							</div>
						</div>
						<div class="form-2col">
							<div class="field-group">
								<label class="field-label">유효기간</label>
								<div class="field-input">
									<span class="field-input__value">12 / 26</span>
								</div>
							</div>
							<div class="field-group">
								<label class="field-label">비밀번호 앞 2자리</label>
								<div class="field-input">
									<span class="field-input__value" style="letter-spacing: 4px;">••</span>
								</div>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">생년월일 (카드주)</label>
							<div class="field-input">
								<span class="field-input__value field-input__value--placeholder">YYYY.MM.DD</span>
							</div>
						</div>
					</div>

					<div class="info-box">
						<div class="info-box__title">카드 등록 안내</div>
						<ul class="info-box__list">
							<li class="info-box__item">법인 명의 카드는 이용이 불가해요</li>
							<li class="info-box__item">삼성/롯데/하나 등 일부 카드사는 유효기간 재입력이 필요해요</li>
							<li class="info-box__item">정기 결제 진행 중인 1차 카드는 변경/삭제할 수 없어요</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">등록하기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
