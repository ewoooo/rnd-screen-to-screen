<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>09. 휴면 해제 완료 — handoff</title>

	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">휴면 해제 완료</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="result-block">
						<div class="result-icon result-icon--success">
							<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
								<polyline points="6,17 13,24 26,9" />
							</svg>
						</div>
						<h2 class="result-block__title">휴면이
해제됐어요</h2>
						<span class="result-block__sub">2026년 4월 28일 오후 2:47</span>
					</div>

					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">회원 상태</span>
							<span class="detail-grid__value detail-grid__value--violet">정상 회원</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">복원된 항목</span>
							<span class="detail-grid__value">프로필, 약관 동의</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">재인증</span>
							<span class="detail-grid__value">휴대폰 인증 완료</span>
						</div>
					</div>

					<div class="status-card">
						<div class="status-card__title">복원 결과</div>
						<div class="status-card__row">
							<span class="status-card__label">기본 프로필</span>
							<span class="status-card__value status-card__value--success">복원 완료</span>
						</div>
						<div class="status-card__row">
							<span class="status-card__label">약관 동의 이력</span>
							<span class="status-card__value status-card__value--success">복원 완료</span>
						</div>
						<div class="status-card__row">
							<span class="status-card__label">이전 알림 설정</span>
							<span class="status-card__value">재설정 필요</span>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">휴면 해제 후 자동 로그인된 상태로 서비스를 이용할 수 있어요.</li>
							<li class="info-box__item">이전 알림 설정은 마이페이지에서 다시 설정할 수 있어요.</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">T우주 시작하기</button>
				</div>
			</div>
		</div>
