<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>TU-MY-AGR-MO-02-BS-001 · 혜택·이벤트 약관동의 (BS) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas" style="background: rgba(0, 0, 0, 0.4); justify-content: flex-end;">
		<!-- backdrop: 부모 화면(MAIN-001-2 발견_case2_로그인) 위에 떠 있음 -->
		<!-- bottom-sheet container -->
		<div class="bottom-sheet">
			<div class="bottom-sheet__handle"></div>

			<div class="result-block" style="align-items: flex-start; padding-top: 0;">
				<h2 class="result-block__title" style="text-align: left; padding-top: 0;">맞춤형 소식,
받아보실래요?</h2>
				<span class="result-block__sub" style="text-align: left; padding: 0;">신규 혜택과 한정 이벤트를 가장 먼저 알려드릴게요.</span>
			</div>

			<!-- SPEC-AGR-01 동의 항목 리스트 -->
			<div class="check-list" style="background: var(--badge-bg); border-radius: 14px; padding: var(--spacing-16);">
				<div class="check-list__row is-checked">
					<span class="check-indicator check-indicator--on">✓</span>
					<span class="check-list__label">이벤트·할인 소식 수신 동의</span>
				</div>
				<div class="check-list__row is-checked">
					<span class="check-indicator check-indicator--on">✓</span>
					<span class="check-list__label">앱 푸시 알림 수신 동의</span>
				</div>
			</div>

			<!-- SPEC-AGR-02 primary CTA -->
			<div class="sticky-cta" style="position: static; padding: 0; background: none;">
				<button class="sticky-cta__btn" type="button">동의하고 시작하기</button>
			</div>

			<!-- SPEC-AGR-02 30일 미노출 텍스트 버튼 -->
			<button type="button" style="border: none; background: transparent; color: var(--semantic-label-alternative); font-size: 13px; text-decoration: underline; cursor: pointer; align-self: center; padding: var(--spacing-4) var(--spacing-8);">30일간 보지 않기</button>
		</div>
	</div>
</body>
</html>
