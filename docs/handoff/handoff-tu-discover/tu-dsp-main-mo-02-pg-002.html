<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>TU-DSP-MAIN-MO-02-PG-002 · 접근권한 안내 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__title">접근권한 안내</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<!-- pay-hero -->
					<div class="pay-hero">
						<h1 class="pay-hero__title">앱 이용에 필요한
권한을 안내드려요</h1>
						<span class="pay-hero__sub">서비스를 정상적으로 이용하려면 아래 권한이 필요합니다. 선택 권한은 동의하지 않아도 서비스 이용이 가능해요.</span>
					</div>

					<!-- SPEC-MAIN-16 필수 접근 권한 -->
					<div class="group">
						<span class="t-section-label">필수 접근 권한</span>
						<div class="status-card">
							<div class="status-card__row">
								<div style="display: flex; align-items: flex-start; gap: var(--spacing-12); flex: 1;">
									<span style="font-size: 22px; line-height: 24px;">📱</span>
									<div style="display: flex; flex-direction: column; gap: 2px;">
										<span class="t-list-title">기기 정보</span>
										<span class="t-list-sub" style="font-weight: 500;">기기 식별 및 부정 이용 방지</span>
									</div>
								</div>
							</div>
							<div class="status-card__row">
								<div style="display: flex; align-items: flex-start; gap: var(--spacing-12); flex: 1;">
									<span style="font-size: 22px; line-height: 24px;">📶</span>
									<div style="display: flex; flex-direction: column; gap: 2px;">
										<span class="t-list-title">네트워크 상태</span>
										<span class="t-list-sub" style="font-weight: 500;">서비스 안정적 연결 확인</span>
								</div>
							</div>
						</div>
					</div>
					</div>

					<!-- SPEC-MAIN-16 선택 접근 권한 -->
					<div class="group">
						<span class="t-section-label">선택 접근 권한</span>
						<div class="status-card" style="background: var(--badge-bg);">
							<div class="status-card__row">
								<div style="display: flex; align-items: flex-start; gap: var(--spacing-12); flex: 1;">
									<span style="font-size: 22px; line-height: 24px;">🔔</span>
									<div style="display: flex; flex-direction: column; gap: 2px;">
										<span class="t-list-title">알림</span>
										<span class="t-list-sub" style="font-weight: 500;">구독 상태·혜택 안내 푸시</span>
									</div>
								</div>
							</div>
							<div class="status-card__row">
								<div style="display: flex; align-items: flex-start; gap: var(--spacing-12); flex: 1;">
									<span style="font-size: 22px; line-height: 24px;">📂</span>
									<div style="display: flex; flex-direction: column; gap: 2px;">
										<span class="t-list-title">사진/파일</span>
										<span class="t-list-sub" style="font-weight: 500;">프로필 이미지 등록</span>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">선택 권한은 동의하지 않아도 서비스 이용이 가능합니다.</li>
							<li class="info-box__item">해당 기능 최초 사용 시점에 다시 요청될 수 있어요.</li>
						</ul>
					</div>
				</div>
			</div>
			<!-- SPEC-MAIN-17 sticky 확인 CTA -->
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">확인</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
