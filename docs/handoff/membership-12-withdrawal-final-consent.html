<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>12. 탈퇴 최종 동의 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">탈퇴 최종 동의</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar">
						<span class="step-bar__dot step-bar__dot--active"></span>
						<span class="step-bar__dot step-bar__dot--active"></span>
						<span class="step-bar__dot step-bar__dot--active"></span>
					</div>
					<div class="pay-hero">
						<h1 class="pay-hero__title">정말로
탈퇴하시겠어요?</h1>
					</div>

					<div class="info-box">
						<span class="info-box__title">철회 가능 기간</span>
						<ul class="info-box__list">
							<li class="info-box__item">탈퇴 후 7일 이내(2026-05-05 23:59까지) 철회 가능해요.</li>
							<li class="info-box__item">철회 시 모든 데이터가 원래대로 복원돼요.</li>
							<li class="info-box__item">7일이 지나면 철회할 수 없어요.</li>
						</ul>
					</div>

					<div class="info-box">
						<span class="info-box__title">개인정보 처리</span>
						<ul class="info-box__list">
							<li class="info-box__item">즉시 파기: 프로필, 마케팅 동의 이력</li>
							<li class="info-box__item">법정 보관: 결제 내역(5년), 분쟁 처리 기록(3년)</li>
						</ul>
					</div>

					<div class="group">
						<div class="terms-row">
							<span class="check-indicator check-indicator--on">✓</span>
							<span class="terms-row__label">탈퇴 및 개인정보 처리에 동의해요<span class="terms-row__required">필수</span></span>
							<span class="terms-row__chev">›</span>
						</div>
						<div class="terms-row">
							<span class="check-indicator check-indicator--on">✓</span>
							<span class="terms-row__label">철회 가능 기간(7일)을 확인했어요<span class="terms-row__required">필수</span></span>
							<span class="terms-row__chev">›</span>
						</div>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">최종 동의하고 탈퇴</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
