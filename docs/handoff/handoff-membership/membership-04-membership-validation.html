<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>04. 회원 검증 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">회원 검증</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="result-block">
						<div class="result-icon result-icon--warning" style="font-size: 28px; font-weight: 800;">ⓘ</div>
						<h2 class="result-block__title">이미 가입한
계정이 있어요</h2>
						<span class="result-block__sub">you@example.com 으로 가입된 정상 회원이에요. 로그인해서 T우주를 이용해 보세요.</span>
					</div>

					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">회원 상태</span>
							<span class="detail-grid__value">정상 회원</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">가입일</span>
							<span class="detail-grid__value">2023.04.18</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">판정 코드</span>
							<span class="detail-grid__value detail-grid__value--violet">DUPLICATE_CI</span>
						</div>
					</div>

					<div class="info-box">
						<span class="info-box__title">다음 단계 안내</span>
						<ul class="info-box__list">
							<li class="info-box__item">이미 가입된 계정으로 로그인해 주세요.</li>
							<li class="info-box__item">비밀번호가 기억나지 않으면 비밀번호 찾기를 이용하세요.</li>
							<li class="info-box__item">본인 명의가 아니라면 고객센터에 문의해 주세요.</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">로그인 페이지로 이동</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
