<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>01. 주 결제 수단 선택 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<!-- Statusbar -->
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>

			<!-- Header -->
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">결제 수단 설정</span>
				</div>
			</div>

			<!-- Body -->
			<div class="detail-shell__body">
				<div class="pay-content">
					<!-- StepBar 1/3 -->
					<div class="step-bar">
						<div class="step-bar__dot step-bar__dot--active"></div>
						<div class="step-bar__dot"></div>
						<div class="step-bar__dot"></div>
					</div>

					<!-- Hero -->
					<div class="pay-hero">
						<h1 class="pay-hero__title">주 결제 수단을
선택해 주세요</h1>
						<p class="pay-hero__sub">정기 결제에 사용할 1차 수단을 선택해 주세요</p>
					</div>

					<!-- 1차 결제 수단 (필수) -->
					<section class="pay-section">
						<div class="sub-label">
							<span class="sub-label__text">1차 결제 수단</span>
							<span class="sub-label__mark--required">
								<span class="sub-label__dot"></span>
								필수
							</span>
						</div>

						<div class="method-card method-card--selected">
							<div class="method-card__icon">💳</div>
							<div class="method-card__text">
								<div class="method-card__name">신용/체크카드</div>
								<div class="method-card__sub">간편결제 또는 직접 입력</div>
							</div>
							<div class="radio-dot radio-dot--selected"></div>
						</div>

						<div class="method-card">
							<div class="method-card__icon">🏦</div>
							<div class="method-card__text">
								<div class="method-card__name">계좌이체</div>
								<div class="method-card__sub">실시간 계좌이체</div>
							</div>
							<div class="radio-dot"></div>
						</div>
					</section>

					<!-- ThinDivider -->
					<div class="divider--thin"></div>

					<!-- 2차 결제 수단 (선택) -->
					<section class="pay-section">
						<div class="sub-label">
							<span class="sub-label__text">2차 결제 수단</span>
							<span class="sub-label__mark">선택</span>
						</div>

						<div class="method-card">
							<div class="method-card__icon">💳</div>
							<div class="method-card__text">
								<div class="method-card__name">신용/체크카드 추가</div>
								<div class="method-card__sub">1차 실패 시 자동 시도</div>
							</div>
							<div class="radio-dot"></div>
						</div>

						<div class="method-card method-card--disabled">
							<div class="method-card__icon">📱</div>
							<div class="method-card__text">
								<div class="method-card__name">간편 결제 (SK pay)</div>
								<div class="method-card__sub">타인 명의 결제 시 비활성</div>
							</div>
							<div class="radio-dot"></div>
						</div>
					</section>

					<!-- InfoBox -->
					<div class="info-box">
						<div class="info-box__title">결제 수단 안내</div>
						<ul class="info-box__list">
							<li class="info-box__item">1차 수단은 등록 후 삭제할 수 없어요</li>
							<li class="info-box__item">타인 명의 카드는 간편결제를 이용할 수 없어요 (최대 5명)</li>
							<li class="info-box__item">법인 명의 카드는 이용이 불가해요</li>
						</ul>
					</div>
				</div>
			</div>

			<!-- StickyCTA -->
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">다음</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
