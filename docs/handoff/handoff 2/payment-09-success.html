<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>09. 결제 완료 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<style>
		.result-block {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: var(--spacing-8);
			padding-top: var(--spacing-16);
		}
		.result-title {
			margin: 0;
			padding-top: 6px;
			text-align: center;
			font-size: 20px;
			font-weight: 700;
			letter-spacing: -1px;
			line-height: 1.3;
			color: var(--semantic-label-normal);
		}
		.result-ts {
			text-align: center;
			font-size: 13px;
			font-weight: 700;
			color: var(--semantic-label-alternative);
		}
		.method-card-summary {
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: var(--card-radius);
			padding: var(--spacing-32);
			display: flex;
			flex-direction: column;
			gap: var(--spacing-12);
		}
		.method-card-summary__label {
			font-size: 13px;
			font-weight: 700;
			letter-spacing: -0.39px;
			color: var(--semantic-label-neutral);
		}
		.method-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: var(--spacing-12) 0;
			border-bottom: 1px solid var(--semantic-line-normal-normal);
		}
		.method-row:last-child { border-bottom: none; }
		.method-row__label {
			font-size: 13px;
			color: var(--semantic-label-alternative);
		}
		.method-row__value {
			font-size: 13px;
			font-weight: 700;
			color: var(--semantic-label-normal);
		}
		.method-row__value--discount {
			color: var(--t-brand);
		}
		.amount-wrap { display: flex; flex-direction: column; }
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">결제 완료</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="result-block">
						<div class="result-icon result-icon--success">
							<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
								<polyline points="6,17 13,24 26,9" />
							</svg>
						</div>
						<h2 class="result-title">결제가 완료됐어요</h2>
						<span class="result-ts">2024년 1월 1일 오전 9:41</span>
					</div>

					<div class="detail-grid">
						<div class="detail-grid__row">
							<span class="detail-grid__label">구독 상품</span>
							<span class="detail-grid__value">T우주 멤버십 (월간)</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">구독 기간</span>
							<span class="detail-grid__value">2024.01.01 ~ 2024.02.01</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">다음 결제일</span>
							<span class="detail-grid__value detail-grid__value--violet">2024년 2월 1일</span>
						</div>
					</div>

					<div class="method-card-summary">
						<span class="method-card-summary__label">결제 수단</span>
						<div>
							<div class="method-row">
								<span class="method-row__label">🎫 T우주 50% 할인쿠폰</span>
								<span class="method-row__value method-row__value--discount">-6,950원</span>
							</div>
							<div class="method-row">
								<span class="method-row__label">⭐ T+ 포인트</span>
								<span class="method-row__value method-row__value--discount">-5,000P</span>
							</div>
							<div class="method-row">
								<span class="method-row__label">💳 신한카드 ••3721</span>
								<span class="method-row__value">1,950원</span>
							</div>
						</div>
					</div>

					<div class="amount-wrap">
						<div class="amount-divider"></div>
						<div class="amount-row amount-row--total">
							<span class="amount-row__label">최종 결제 금액</span>
							<span class="amount-row__value">1,950원</span>
						</div>
					</div>

					<div class="info-box">
						<ul class="info-box__list">
							<li class="info-box__item">결제 안내 문자가 발송됐어요 (SMS)</li>
							<li class="info-box__item">영수증은 마이페이지 → 결제 내역에서 확인할 수 있어요</li>
							<li class="info-box__item">결제 내역은 5년간 보관돼요</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">T우주 시작하기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
