<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>03. 계좌 정보 입력 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<style>
		.form-stack { display: flex; flex-direction: column; gap: var(--spacing-16); }
		.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-12); }
		.field-trail {
			color: var(--semantic-label-alternative);
			font-size: 16px;
		}
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">계좌 정보 입력</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar">
						<div class="step-bar__dot step-bar__dot--active"></div>
						<div class="step-bar__dot step-bar__dot--active"></div>
						<div class="step-bar__dot"></div>
					</div>

					<div class="pay-hero">
						<h1 class="pay-hero__title">출금 계좌를
등록해 주세요</h1>
						<p class="pay-hero__sub">실시간 계좌이체로 정기 결제가 진행돼요</p>
					</div>

					<div class="form-stack">
						<div class="field-group">
							<label class="field-label">은행 선택</label>
							<div class="field-input field-input--focused">
								<span class="field-input__value">토스뱅크</span>
								<span class="field-trail">›</span>
							</div>
						</div>
						<div class="field-group">
							<label class="field-label">계좌번호</label>
							<div class="field-input">
								<span class="field-input__value field-input__value--placeholder">숫자만 입력해 주세요</span>
							</div>
						</div>
						<div class="form-2col">
							<div class="field-group">
								<label class="field-label">예금주</label>
								<div class="field-input">
									<span class="field-input__value">이우성</span>
								</div>
							</div>
							<div class="field-group">
								<label class="field-label">예금주 생년월일</label>
								<div class="field-input">
									<span class="field-input__value field-input__value--placeholder">YYYY.MM.DD</span>
								</div>
							</div>
						</div>
					</div>

					<div class="info-box">
						<div class="info-box__title">이용 가능 계좌</div>
						<ul class="info-box__list">
							<li class="info-box__item">국민·신한·하나·우리·농협·카카오뱅크·토스뱅크 등 실시간 이체 지원 은행</li>
							<li class="info-box__item">일부 증권사 계좌·평생 계좌번호는 이용 불가</li>
							<li class="info-box__item">2차 결제 수단으로는 계좌이체를 선택할 수 없어요</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="sticky-cta">
					<button class="sticky-cta__btn" type="button">등록하기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
