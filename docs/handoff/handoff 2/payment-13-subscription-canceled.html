<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>13. 구독 해지 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<style>
		.dim-card-inner {
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: var(--card-radius);
			padding: var(--spacing-32);
			display: flex;
			flex-direction: column;
			gap: var(--spacing-8);
		}
		.dim-card-name {
			font-size: 18px;
			font-weight: 700;
			color: var(--semantic-label-normal);
		}
		.dim-card-sub {
			font-size: 13px;
			font-weight: 700;
			color: var(--semantic-label-alternative);
		}
		.sheet-title {
			margin: 0;
			text-align: center;
			font-size: 20px;
			font-weight: 700;
			letter-spacing: -1px;
			line-height: 1.3;
			color: var(--semantic-label-normal);
		}
		.sheet-subtitle {
			text-align: center;
			font-size: 13px;
			font-weight: 700;
			color: var(--semantic-label-alternative);
		}
		.sheet-body {
			margin: 0;
			font-size: 13px;
			color: var(--semantic-label-alternative);
			line-height: 20.8px;
			text-align: center;
		}
		.warning-box {
			background: var(--semantic-fill-normal);
			border-radius: 10px;
			padding: var(--spacing-12);
			font-size: 12px;
			color: var(--t-brand);
			font-weight: 600;
			line-height: 19.2px;
			width: 100%;
			box-sizing: border-box;
		}
		.bottom-sheet { align-items: center; }
		.bottom-sheet > .result-icon { width: 64px; }
		.dim-card { filter: blur(1px); opacity: 0.4; }
	</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status">
				<span>7:28</span>
				<span class="ph" style="width: 56px; height: 14px;">status</span>
			</div>
			<div class="detail-shell__header">
				<div class="detail-shell__head-left">
					<span class="detail-shell__back">‹</span>
					<span class="detail-shell__title">구독 해지</span>
				</div>
			</div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="dim-card">
						<div class="dim-card-inner">
							<span class="dim-card-name">T우주 멤버십</span>
							<span class="dim-card-sub">13,900원/월</span>
						</div>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="bottom-sheet">
					<div class="result-icon result-icon--warning">
						<span style="font-size: 30px;">✕</span>
					</div>
					<h2 class="sheet-title">구독이 해지됐어요</h2>
					<span class="sheet-subtitle">2024년 2월 1일 (다음 정기결제일 도래)</span>
					<div class="detail-grid" style="width: 100%;">
						<div class="detail-grid__row">
							<span class="detail-grid__label">해지 사유</span>
							<span class="detail-grid__value">정기결제 보류 후 미결제</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">마지막 이용일</span>
							<span class="detail-grid__value">2024년 1월 31일</span>
						</div>
						<div class="detail-grid__row">
							<span class="detail-grid__label">환불 금액</span>
							<span class="detail-grid__value detail-grid__value--discount">0원 (사용 완료)</span>
						</div>
					</div>
					<div class="warning-box">해지일(M+1D) 당일에는 즉시 결제·결제 취소·결제 수단 변경 등 모든 업무가 불가해요.</div>
					<p class="sheet-body">T우주 서비스를 다시 이용하려면 새로 가입해 주세요.</p>
					<button class="sticky-cta__btn" type="button" style="width: 100%; margin-top: var(--spacing-4);">T우주 다시 가입하기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
