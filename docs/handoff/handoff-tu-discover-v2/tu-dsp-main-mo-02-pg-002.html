<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>TU-DSP-MAIN-MO-02-PG-002 · 접근권한 안내 — handoff v2.1</title>
	<link rel="stylesheet" href="_tu-tone.css" />
</head>
<body>
	<div class="tu-stage">
		<div class="tu-canvas">
			<!-- Minimal close-only top -->
			<div class="tu-app-top tu-app-top--close">
				<div class="tu-app-top__bar">
					<button class="tu-close-btn" aria-label="닫기">×</button>
				</div>
			</div>

			<!-- Body -->
			<div class="tu-body tu-body--detail">
				<header class="tu-hero" style="padding-top: var(--spacing-12);">
					<h1 class="tu-display tu-display--lg">앱 이용에
필요한 권한을
안내드려요</h1>
					<span class="tu-sub">서비스를 정상적으로 이용하려면 아래 권한이 필요합니다. 선택 권한은 동의하지 않아도 서비스 이용이 가능해요.</span>
				</header>

				<!-- SPEC-MAIN-16 필수 -->
				<span class="tu-group-label">필수 접근 권한</span>
				<div class="tu-group-card">
					<div class="tu-perm">
						<div class="tu-perm__icon">📱</div>
						<div class="tu-perm__text">
							<div class="tu-perm__title">기기 정보 <span class="tu-perm__chip">필수</span></div>
							<div class="tu-perm__sub">기기 식별 및 부정 이용 방지</div>
						</div>
					</div>
					<div class="tu-perm">
						<div class="tu-perm__icon">📶</div>
						<div class="tu-perm__text">
							<div class="tu-perm__title">네트워크 상태 <span class="tu-perm__chip">필수</span></div>
							<div class="tu-perm__sub">서비스 안정적 연결 확인</div>
						</div>
					</div>
				</div>

				<!-- SPEC-MAIN-16 선택 -->
				<span class="tu-group-label">선택 접근 권한</span>
				<div class="tu-group-card">
					<div class="tu-perm">
						<div class="tu-perm__icon">🔔</div>
						<div class="tu-perm__text">
							<div class="tu-perm__title">알림 <span class="tu-perm__chip tu-perm__chip--mute">선택</span></div>
							<div class="tu-perm__sub">구독 상태·혜택 안내 푸시</div>
						</div>
					</div>
					<div class="tu-perm">
						<div class="tu-perm__icon">📂</div>
						<div class="tu-perm__text">
							<div class="tu-perm__title">사진/파일 <span class="tu-perm__chip tu-perm__chip--mute">선택</span></div>
							<div class="tu-perm__sub">프로필 이미지 등록</div>
						</div>
					</div>
				</div>

				<div class="tu-notice">
					<span class="tu-notice__dot"></span>
					<span>해당 기능 최초 사용 시점에 다시 요청될 수 있어요</span>
				</div>
			</div>

			<!-- SPEC-MAIN-17 Sticky CTA -->
			<div class="tu-sticky">
				<button class="tu-cta" type="button">확인</button>
			</div>
		</div>
	</div>
</body>
</html>
