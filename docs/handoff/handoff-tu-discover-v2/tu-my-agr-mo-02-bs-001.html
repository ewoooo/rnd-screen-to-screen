<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>TU-MY-AGR-MO-02-BS-001 · 혜택·이벤트 약관동의 BS — handoff v2.1</title>
	<link rel="stylesheet" href="_tu-tone.css" />
</head>
<body>
	<div class="tu-stage">
		<div class="tu-canvas">
			<!-- 부모 화면 silhouette (발견_case2_로그인) -->
			<div class="tu-parent-silhouette">
				<div class="tu-app-top">
					<div class="tu-app-top__status">
						<span>9:41</span>
						<span>● ● ●</span>
					</div>
					<div class="tu-app-top__bar">
						<span class="tu-app-top__logo">T</span>
						<div class="tu-app-top__icons">
							<span>⌕</span>
							<span>🛍</span>
							<span>≡</span>
						</div>
					</div>
				</div>
				<div class="tu-parent-silhouette__hero">
					<h1 class="tu-display tu-display--lg">최우성 님,
오늘은 어떤 구독을
만나볼까요?</h1>
				</div>
			</div>

			<!-- Backdrop + Sheet -->
			<div class="tu-backdrop">
				<div class="tu-sheet">
					<div class="tu-sheet__handle"></div>

					<header class="tu-sheet__header">
						<h2 class="tu-display">맞춤형 소식,
받아보실래요?</h2>
						<span class="tu-sub">신규 혜택과 한정 이벤트를 가장 먼저 알려드릴게요.</span>
					</header>

					<!-- SPEC-AGR-01 -->
					<div>
						<label class="tu-check-row">
							<span class="tu-check tu-check--on">✓</span>
							<span class="tu-check-row__label">이벤트·할인 소식 수신 동의</span>
						</label>
						<label class="tu-check-row">
							<span class="tu-check tu-check--on">✓</span>
							<span class="tu-check-row__label">앱 푸시 알림 수신 동의</span>
						</label>
					</div>

					<!-- SPEC-AGR-02 -->
					<button class="tu-cta" type="button">동의하고 시작하기</button>
					<button class="tu-text-btn tu-text-btn--underline" type="button">30일간 보지 않기</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
