<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v2 · 21. 정보 입력 (재가입) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">정보 입력 (재가입)</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">복원할 정보를
확인해 주세요</h1><span class="pay-hero__sub">이전 계정에서 복원할 항목을 선택하고 변경된 약관에 다시 동의해요.</span></div>
					<div class="form-stack">
						<div class="field-group"><label class="field-label">이름 (이전 정보)</label><div class="field-input"><span class="field-input__value">이정훈</span><span class="action-chip action-chip--fill">유지</span></div></div>
						<div class="field-group"><label class="field-label">이메일</label><div class="field-input"><span class="field-input__value">junghoon99@example.com</span><span class="action-chip action-chip--fill">중복확인</span></div></div>
						<div class="field-group"><label class="field-label">휴대폰 번호</label><div class="field-input field-input--focused"><span class="field-input__value">010-1234-5678</span></div></div>
					</div>
					<div class="terms-row terms-row--emph"><span class="check-indicator check-indicator--on">✓</span><span class="terms-row__label">변경된 약관에 다시 동의해요<span class="terms-row__required">필수</span></span></div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">유지를 선택한 정보는 그대로 사용해요.</li><li class="info-box__item">변경된 약관에 동의하지 않으면 재가입을 진행할 수 없어요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">재가입 진행</button></div></div>
		</div>
	</div>
</body>
</html>
