<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 06. 로그인 (휴면 진입) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">로그인</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="pay-hero"><h1 class="pay-hero__title">T우주에 다시 오신 걸
환영해요</h1><span class="pay-hero__sub">아이디와 비밀번호를 입력해 로그인해 주세요.</span></div>
					<div class="form-stack">
						<div class="field-group"><label class="field-label">아이디</label><div class="field-input"><span class="field-input__value field-input__value--placeholder">아이디 입력</span></div></div>
						<div class="field-group"><label class="field-label">비밀번호</label><div class="field-input"><span class="field-input__value field-input__value--placeholder">비밀번호 입력</span></div></div>
					</div>
					<div class="aux-links">
						<span class="aux-links__item">아이디 찾기</span>
						<span class="aux-links__sep">·</span>
						<span class="aux-links__item">비밀번호 재설정</span>
						<span class="aux-links__sep">·</span>
						<span class="aux-links__item">회원가입</span>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">공용 기기에서는 자동 로그인을 끄세요.</li><li class="info-box__item">한동안 사용하지 않은 계정은 휴면 상태일 수 있어요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">로그인</button></div></div>
		</div>
	</div>
</body>
</html>
