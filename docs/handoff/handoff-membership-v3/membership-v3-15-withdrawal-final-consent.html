<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 15. 탈퇴 최종 동의 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">탈퇴 최종 동의</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">정말 탈퇴하시겠어요?
한 번 더 확인할게요</h1><span class="pay-hero__sub">아래 문구를 정확히 입력하면 탈퇴 처리가 시작돼요.</span></div>

					<div class="status-card">
						<div class="status-card__title">확인된 영향 요약</div>
						<div class="status-card__row"><span class="status-card__label">소멸 포인트</span><span class="status-card__value">3,420 P</span></div>
						<div class="status-card__row"><span class="status-card__label">자동 해지 서비스</span><span class="status-card__value">3건</span></div>
						<div class="status-card__row"><span class="status-card__label">철회 가능 기간</span><span class="status-card__value status-card__value--warning">7일</span></div>
					</div>

					<div class="form-stack">
						<div class="field-group"><label class="field-label">아래 문구를 그대로 입력해 주세요</label><div class="field-input field-input--focused"><span class="field-input__value field-input__value--placeholder">탈퇴합니다</span></div><span class="field-help">대소문자·띄어쓰기까지 정확히 일치해야 활성화돼요.</span></div>
					</div>
					<div class="terms-row terms-row--emph"><span class="check-indicator check-indicator--off"></span><span class="terms-row__label">위 모든 내용에 동의하고 탈퇴를 요청합니다</span></div>

					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">탈퇴 후 7일 안에는 철회를 요청할 수 있어요.</li><li class="info-box__item">철회 기간이 끝나면 처리는 비가역적이에요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn sticky-cta__btn--danger" type="button" disabled>탈퇴 처리하기</button></div></div>
		</div>
	</div>
</body>
</html>
