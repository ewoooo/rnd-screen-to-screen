<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 10. 휴면 해제 처리 중 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__title">휴면 해제 처리 중</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span></div>
					<div class="result-block">
						<div class="result-icon result-icon--success rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>
						<h1 class="result-block__title">휴면을 해제하고 있어요
잠시만 기다려 주세요</h1>
						<span class="result-block__sub">분리보관된 정보를 복원하고 있어요. 보통 30초 ~ 1분이 걸려요.</span>
					</div>
					<div class="status-card">
						<div class="status-card__title">진행 단계</div>
						<div class="status-card__row"><span class="status-card__label">회원 상태 정상으로 전환</span><span class="status-card__value status-card__value--success">완료</span></div>
						<div class="status-card__row"><span class="status-card__label">분리보관 데이터 복원</span><span class="status-card__value status-card__value--success">진행 중</span></div>
						<div class="status-card__row"><span class="status-card__label">로그인 세션 생성</span><span class="status-card__value">대기</span></div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">처리 중에 화면을 닫지 말아 주세요.</li><li class="info-box__item">예상보다 오래 걸리면 자동으로 재시도해요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button" disabled>처리 중...</button></div></div>
		</div>
	</div>
</body>
</html>
