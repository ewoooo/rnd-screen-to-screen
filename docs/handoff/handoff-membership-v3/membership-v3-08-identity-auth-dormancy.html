<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 08. 본인인증 (휴면 해제) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />

	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">본인인증</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">휴면 해제 전
본인 확인이 필요해요</h1><span class="pay-hero__sub">기존에 등록된 휴대폰으로 본인 여부를 확인해요.</span></div>
					<div class="method-toggle"><div class="method-toggle__seg method-toggle__seg--active">휴대폰 인증</div><div class="method-toggle__seg">아이핀</div></div>
					<div class="form-stack">
						<div class="field-group"><label class="field-label">휴대폰 번호 (등록된 정보)</label><div class="field-input"><span class="field-input__value">010-****-5678</span><span class="action-chip action-chip--fill">인증번호 받기</span></div></div>
						<div class="field-group"><label class="field-label">인증번호</label><div class="field-input field-input--focused"><span class="field-input__value" style="letter-spacing: 6px;">821•••</span><span class="action-chip action-chip--tabular">02:34</span></div></div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">기존 회원 정보로 인증해요. 번호가 바뀐 경우 고객센터로 문의하세요.</li><li class="info-box__item">인증 완료 후 변경된 약관을 다시 확인하게 돼요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">확인</button></div></div>
		</div>
	</div>
