<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 13. 탈퇴 사유 입력 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">탈퇴 사유</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">떠나시는 이유를
알려주세요</h1><span class="pay-hero__sub">서비스를 개선하는 데에만 사용해요. 한 가지만 골라 주세요.</span></div>
					<div class="check-list">
						<div class="check-list__row is-checked"><span class="check-indicator check-indicator--on">✓</span><span class="check-list__label">자주 쓰지 않아서</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">제공되는 혜택이 부족해서</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">사용 중 불편한 점이 있어서</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">개인정보 관리가 걱정돼서</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">기타 (직접 입력)</span></div>
					</div>
					<div class="char-textarea">
						<span class="char-textarea__label">상세 의견 (선택)</span>
						<div class="char-textarea__box">
							<div class="char-textarea__value char-textarea__value--placeholder">개선해 드릴 수 있는 부분이 있다면 적어 주세요. 익명으로 처리돼요.</div>
							<div class="char-textarea__counter">0 / 200</div>
						</div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">상세 의견은 익명으로 저장돼요.</li><li class="info-box__item">금칙어가 포함되면 저장되지 않아요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">다음</button></div></div>
		</div>
	</div>
</body>
</html>
