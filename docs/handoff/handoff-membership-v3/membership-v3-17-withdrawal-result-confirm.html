<!DOCTYPE html>
<html lang="ko">
<head>

<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__title">탈퇴 결과</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot step-bar__dot--active"></span></div>
					<div class="result-block">
						<div class="result-icon result-icon--warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 7 12 13 16 15"/></svg></div>
						<h1 class="result-block__title">탈퇴를 접수했어요
7일 안에는 다시 되돌릴 수 있어요</h1>
						<span class="result-block__sub">유예 기간이 끝나면 처리는 비가역적으로 확정돼요.</span>
					</div>
					<div class="status-card">
						<div class="status-card__title">처리 결과</div>
						<div class="status-card__row"><span class="status-card__label">회원 상태</span><span class="status-card__value status-card__value--warning">탈퇴유예</span></div>
						<div class="status-card__row"><span class="status-card__label">유예 종료일</span><span class="status-card__value">2026.05.05 23:59</span></div>
						<div class="status-card__row"><span class="status-card__label">철회 가능 여부</span><span class="status-card__value status-card__value--success">가능</span></div>
						<div class="status-card__row"><span class="status-card__label">알림 발송</span><span class="status-card__value">SMS · 이메일</span></div>
					</div>
					<div class="info-box"><div class="info-box__title">철회하려면</div><ul class="info-box__list"><li class="info-box__item">유예 기간 안에 같은 본인 정보로 로그인하면 철회 안내가 보여요.</li><li class="info-box__item">유예가 끝나면 90일간 같은 정보로 재가입이 제한될 수 있어요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom">
				<div class="dual-cta">
					<button class="sticky-cta__btn" style="background: var(--semantic-fill-normal); color: var(--semantic-label-normal);" type="button">닫기</button>
					<button class="sticky-cta__btn" type="button">탈퇴 철회하기</button>

			</div>
		</div>
