<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v3 · 18. 본인인증 (재가입) — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
	<style>.form-stack { display: flex; flex-direction: column; gap: var(--spacing-12); }</style>
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">재가입</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">다시 오신 걸 환영해요
먼저 본인 확인이 필요해요</h1><span class="pay-hero__sub">기존 가입 이력이 확인되면 일부 정보가 자동으로 채워져요.</span></div>
					<div class="method-toggle"><div class="method-toggle__seg method-toggle__seg--active">휴대폰 인증</div><div class="method-toggle__seg">아이핀</div></div>
					<div class="form-stack">
						<div class="field-group"><label class="field-label">휴대폰 번호</label><div class="field-input"><span class="field-input__value field-input__value--placeholder">010-0000-0000</span><span class="action-chip action-chip--fill">인증번호 받기</span></div></div>
						<div class="field-group"><label class="field-label">인증번호</label><div class="field-input"><span class="field-input__value field-input__value--placeholder">6자리 입력</span><span class="action-chip action-chip--tabular">03:00</span></div></div>
					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">기존 정보 일부는 보관 기간 내인 경우에만 다시 사용할 수 있어요.</li><li class="info-box__item">탈퇴 후 일정 기간이 지나지 않았다면 재가입이 제한될 수 있어요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">확인</button></div></div>
		</div>
	</div>
</body>
</html>
