<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=360, initial-scale=1" />
	<title>v2 · 13. 탈퇴 사유 입력 — handoff</title>
	<link rel="stylesheet" href="_shared.css" />
	<link rel="stylesheet" href="_payment.css" />
	<link rel="stylesheet" href="_membership.css" />
</head>
<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">탈퇴 사유</span></div></div>
			<div class="detail-shell__body">
				<div class="pay-content">
					<div class="step-bar"><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot step-bar__dot--active"></span><span class="step-bar__dot"></span><span class="step-bar__dot"></span></div>
					<div class="pay-hero"><h1 class="pay-hero__title">탈퇴하시는 이유가
무엇인가요?</h1><span class="pay-hero__sub">더 나은 서비스를 위해 알려주세요. (1개 이상 선택)</span></div>
					<div class="check-list">
						<div class="check-list__row is-checked"><span class="check-indicator check-indicator--on">✓</span><span class="check-list__label">가격이 부담돼요</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">이용 빈도가 낮아요</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">다른 서비스로 옮겨요</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">사용이 불편해요</span></div>
						<div class="check-list__row"><span class="check-indicator check-indicator--off"></span><span class="check-list__label">오류·결제 문제가 있었어요</span></div>
						<div class="check-list__row is-checked"><span class="check-indicator check-indicator--on">✓</span><span class="check-list__label">기타 (직접 입력)</span></div>
					</div>
					<div class="char-textarea">
						<label class="char-textarea__label">자유 의견 (선택)</label>
						<div class="char-textarea__box"><div class="char-textarea__value">구독료가 다른 서비스 대비 부담돼서요.</div><div class="char-textarea__counter">21/500</div></div>
					</div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">다음</button></div></div>
		</div>
	</div>
</body>
</html>
