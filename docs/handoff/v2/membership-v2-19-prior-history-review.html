<!DOCTYPE html>
<html lang="ko">
<head>

<body>
	<div class="canvas">
		<div class="detail-shell">
			<div class="detail-shell__status"><span>7:28</span><span class="ph" style="width: 56px; height: 14px;">status</span></div>
			<div class="detail-shell__header"><div class="detail-shell__head-left"><span class="detail-shell__back">‹</span><span class="detail-shell__title">이력 확인</span></div></div>
			<div class="detail-shell__body">

확인했어요</h1><span class="pay-hero__sub">동일한 본인인증 정보로 가입한 계정 이력이에요.</span></div>
					<div class="detail-grid">
						<div class="detail-grid__row"><span class="detail-grid__label">기존 회원 ID</span><span class="detail-grid__value">u-1820-0042</span></div>
						<div class="detail-grid__row"><span class="detail-grid__label">원 가입일</span><span class="detail-grid__value">2024.01.15</span></div>
						<div class="detail-grid__row"><span class="detail-grid__label">탈퇴일</span><span class="detail-grid__value">2025.10.20</span></div>
					</div>
					<div class="status-card">
						<div class="status-card__title">이력 타임라인</div>
						<div class="status-card__row"><span class="status-card__label">가입</span><span class="status-card__value status-card__value--success">2024.01.15</span></div>

						<div class="status-card__row"><span class="status-card__label">휴면 해제</span><span class="status-card__value status-card__value--success">2025.06.02</span></div>

					</div>
					<div class="info-box"><ul class="info-box__list"><li class="info-box__item">이력은 재가입 가능 여부 판정과 데이터 복원에 사용돼요.</li></ul></div>
				</div>
			</div>
			<div class="detail-shell__bottom"><div class="sticky-cta"><button class="sticky-cta__btn" type="button">재가입 가능 여부 확인</button></div></div>
		</div>
